name = "blico"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Modelo padrão: rápido e barato para escolher ferramentas. Troque por claude-sonnet-5-5 para planos longos.
MODEL = "claude-haiku-5-5"
DAILY_LIMIT = "300"

# Contador diário de pedidos. Crie com: npx wrangler kv namespace create USAGE
# e cole o id abaixo. Sem ele, o servidor funciona sem limite diário.
# [[kv_namespaces]]
# binding = "USAGE"
# id = "cole-o-id-aqui"

# Segredos (nunca neste arquivo):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put DEVICE_TOKEN

# Prévias por PR da integração da Cloudflare com o GitHub (`wrangler preview`).
# O bloco precisa existir e não pode ficar vazio no build da Cloudflare. Segredos de prévia
# são separados (`npx wrangler preview secret put`); sem eles a prévia só responde /health.
[previews.vars]
MODEL = "claude-haiku-5-5"
DAILY_LIMIT = "50"
