name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes, lint e APK debug
        run: ./gradlew --stacktrace test lint assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blico-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Testes e checagem de tipos do servidor
        run: |
          npm test
          npm run typecheck
