name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # A chave fica nos segredos do repositório; em PR de fork ou sem segredo, o APK sai com a chave de debug.
      - name: Chave de assinatura fixa
        env:
          KEYSTORE_BASE64: ${{ secrets.BLICO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/blico.jks"
            echo "BLICO_KEYSTORE_FILE=$RUNNER_TEMP/blico.jks" >> "$GITHUB_ENV"
          fi
      - name: Testes, lint e APK debug
        env:
          BLICO_KEYSTORE_PASSWORD: ${{ secrets.BLICO_KEYSTORE_PASSWORD }}
          BLICO_KEY_ALIAS: ${{ secrets.BLICO_KEY_ALIAS }}
          BLICO_KEY_PASSWORD: ${{ secrets.BLICO_KEY_PASSWORD }}
        run: ./gradlew --stacktrace test lint assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blico-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Testes e checagem de tipos do servidor
        run: |
          npm test
          npm run typecheck
